# Optional: run PostgreSQL in Docker instead of installing it locally.
#   docker compose up -d
# Set POSTGRES_PASSWORD in your shell (or a root .env file, which is git-ignored) and use the
# same password in backend/.env.
services:
  db:
    image: postgres:16
    container_name: land_records_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: land_records
    ports:
      - "5432:5432"
    volumes:
      - land_records_pgdata:/var/lib/postgresql/data

volumes:
  land_records_pgdata:
